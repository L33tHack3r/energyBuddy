services:
  energy-coach:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - energy-coach-state:/state
    environment:
      PORT: "8000"
      DATABASE_PATH: /state/energy_coach.sqlite3
      DATA_DIR: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  energy-coach-state:
